<p-dialog
  [(visible)]="visible"
  (onHide)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  styleClass="transaction-dialog"
  [style]="{ width: '460px' }">

  <!-- ── Header ── -->
  <ng-template pTemplate="header">
    <div class="modal-header">
      <span class="modal-icon" [ngClass]="current.iconClass">
        <i [class]="current.icon"></i>
      </span>
        <span class="modal-title">{{ dialogTitle }}</span>
    </div>
  </ng-template>

  <!-- ── Body ── -->
  <ng-template pTemplate="content">
    <div class="form-body">

      <!-- Description -->
      <div class="field">
        <label for="description">Description</label>
        <input
          pInputText
          id="description"
          [(ngModel)]="form.description"
          placeholder="e.g. Freelance payment, Netflix..."
          [class.ng-invalid]="errors['description']"
          [class.ng-dirty]="errors['description']" />
        <small class="field-error" *ngIf="errors['description']">
          <i class="pi pi-exclamation-circle"></i> {{ errors['description'] }}
        </small>
      </div>

      <!-- Method -->
      <div class="field">
        <label for="method">Payment Method</label>
        <p-select
          inputId="method"
          [options]="methodOptions"
          [(ngModel)]="form.paymentMethod"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a method"
          styleClass="w-full"
          [class.ng-invalid]="errors['paymentMethod']"
          [class.ng-dirty]="errors['paymentMethod']" />

          @if(errors['paymentMethod']){
            <small class="field-error">
              <i class="pi pi-exclamation-circle"></i> {{ errors['paymentMethod'] }}
            </small>
          }
      </div>

      <!-- Category -->
      <div class="field">
        <label for="categoryId">Category</label>
        <p-select
          inputId="categoryId"
          [options]="availableCategories"
          [(ngModel)]="form.categoryId"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a category"
          styleClass="w-full"
          [class.ng-invalid]="errors['categoryId']"
          [class.ng-dirty]="errors['categoryId']" />

          @if(errors['categoryId']){
              <small class="field-error">
                <i class="pi pi-exclamation-circle"></i> {{ errors['paymentMethod'] }}
            </small>
          }
      </div>

      <!-- Date + Amount (side by side) -->
      <div class="field-row">

        <div class="field">
          <label for="date">Date</label>
          <p-datepicker
            inputId="date"
            [(ngModel)]="form.launchDate"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            [showButtonBar]="true"
            placeholder="dd/mm/yyyy"
            styleClass="w-full"
            [class.ng-invalid]="errors['launchDate']"
            [class.ng-dirty]="errors['launchDate']" />

            @if(errors['launchDate']){
              <small class="field-error">
              <i class="pi pi-exclamation-circle"></i> {{ errors['launchDate'] }}
            </small>
          }
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <p-inputNumber
            inputId="amount"
            [(ngModel)]="form.value"
            mode="currency"
            currency="USD"
            locale="en-US"
            placeholder="0.00"
            styleClass="w-full"
            [class.ng-invalid]="errors['value']"
            [class.ng-dirty]="errors['value']" />
            @if(errors['value']){
              <small class="field-error">
              <i class="pi pi-exclamation-circle"></i> {{ errors['value'] }}
            </small>
          }
        </div>

      </div>

    </div>
  </ng-template>

  <!-- ── Footer ── -->
  <ng-template pTemplate="footer">
    <div class="modal-footer">
      <p-button
        label="Cancel"
        [text]="true"
        severity="secondary"
        (onClick)="close()" />

      <p-button
          [label]="submitLabel"
        [icon]="current.icon"
        [severity]="current.btnSeverity"
        (onClick)="submit()" />
    </div>
  </ng-template>

</p-dialog>
