<div class="actions-grid">
  <button class="card action-card action-income" (click)="onIncomeClick()">
    <span class="action-icon action-icon--green">
      <i class="pi pi-plus-circle" style="font-size: 1.5rem"></i>
    </span>
    <div>
      <p class="action-title">Add income</p>
      <p class="action-sub">Create an income manually</p>
    </div>
  </button>

  <button class="card action-card action-expense" (click)="onExpenseClick()">
    <span class="action-icon action-icon--red">
      <i class="pi pi-minus-circle" style="font-size: 1.5rem"></i>
    </span>
    <div>
      <p class="action-title">Add expense</p>
      <p class="action-sub">Create an expense manually</p>
    </div>
  </button>
</div>
