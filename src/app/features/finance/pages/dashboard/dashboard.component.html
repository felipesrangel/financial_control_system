@if(loading()){
  <div class="spinner-container">
    <p-progress-spinner ariaLabel="loading" [style]="{ width: '200px', height: '200px' }"/>
  </div>
}@else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <!-- ═══════════════════════  NAVBAR  ═══════════════════════ -->
  <app-navbar></app-navbar>
  <!-- ═══════════════════════  MAIN  ═══════════════════════ -->
  <main class="dashboard">

    <!-- Header row -->
    <div class="dashboard-header">
      <h1 class="greeting">Hello, Mark!</h1>

      <div class="period-tabs">
        @for(p of periods; track p){
          <button
            [class.active]="selectedPeriod === p.key"
            (click)="selectPeriod(p.key)"
            class="period-tab">
            {{ p.label }}
          </button>
        }
        <button class="period-tab period-calendar">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Select period
        </button>
      </div>
    </div>

    <!-- ── Summary cards ── -->
    <app-summary-card [summary]="summary()"></app-summary-card>

    <!-- ── Quick actions ── -->
    <app-action-card (actionClick)="onActionClick($event)"></app-action-card>

    <!-- ── Bottom section ── -->
    <div class="bottom-grid">

      <!-- Donut chart -->
      <app-donut-chart
        [transactions]="allTransactions()"
        [categories]="categories()"></app-donut-chart>

      <!-- Transactions table -->
      <app-transaction-table
        [transactions]="transactions()"
        (editRequested)="onEditRequested($event)"></app-transaction-table>
    </div>

    <div class="transactions-pagination">
      <p-paginator
        [first]="(transactionsPageNumber() - 1) * transactionsPageSize()"
        [rows]="transactionsPageSize()"
        [totalRecords]="transactionsTotalCount()"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        (onPageChange)="onTransactionsPageChange($event)">
      </p-paginator>
    </div>
  </main>
}

<app-transcation-modal
  [(visible)]="modalVisible"
  [type]="modalType"
    [mode]="modalMode"
  [categories]="categories()"
    [launch]="selectedLaunch"
  (submitted)="onTransactionSubmitted($event)" />
