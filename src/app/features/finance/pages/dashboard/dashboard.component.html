<!-- ═══════════════════════  NAVBAR  ═══════════════════════ -->
<app-navbar></app-navbar>
<!-- ═══════════════════════  MAIN  ═══════════════════════ -->
<main class="dashboard">

  <!-- Header row -->
  <div class="dashboard-header">
    <h1 class="greeting">Hello, Mark!</h1>

    <div class="period-tabs">
      @for(p of periods; track p){
        <button
          [class.active]="selectedPeriod === p.key"
          (click)="selectPeriod(p.key)"
          class="period-tab">
          {{ p.label }}
        </button>
      }
      <button class="period-tab period-calendar">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Select period
      </button>
    </div>
  </div>

  <!-- ── Summary cards ── -->
  <app-summary-card></app-summary-card>

  <!-- ── Quick actions ── -->
  <app-action-card (actionClick)="onActionClick($event)"></app-action-card>

  <!-- ── Bottom section ── -->
  <div class="bottom-grid">

    <!-- Donut chart -->
    <app-donut-chart></app-donut-chart>

    <!-- Transactions table -->
    <app-transaction-table [transactions]="transactions"></app-transaction-table>
  </div>
</main>

<app-transcation-modal
  [(visible)]="modalVisible"
  [type]="modalType"
  (submitted)="onTransactionSubmitted($event)" />
